name: build-and-push.yaml

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  environment:
    runs-on: ubuntu-latest
    outputs:
      appVersion: ${{ steps.app.outputs.appVersion }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Read App Version
      id: app
      run: |
        APP_VERSION=$(tr -d '[:space:]' < VERSION)
        echo "appVersion=$APP_VERSION" >> $GITHUB_OUTPUT
        echo "App version: $APP_VERSION"
    
  docker:
    needs: environment
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
          ghcr.io/${{ github.repository }}:${{ needs.environment.outputs.appVersion }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Trigger helm image bump
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.HELM_DISPATCH_TOKEN }}
        TAG: ${{ needs.environment.outputs.appVersion }}
        CHART: ${{ github.event.repository.name }}
      run: |
        gh api repos/chris911e/helm/dispatches \
          -f event_type=image-published \
          -F "client_payload[chart]=$CHART" \
          -F "client_payload[tag]=$TAG" \
          -F "client_payload[env]=dev"