name: build-and-push.yaml

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  environment:
    runs-on: ubuntu-latest
    outputs:
      appVersion: ${{ steps.app.outputs.appVersion }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Read Chart
      id: chart
      run: |
        VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
        NAME=$(grep '^name:' helm/Chart.yaml | awk '{print $2}')

        echo "chartVersion=$VERSION" >> $GITHUB_OUTPUT
        echo "chartName=$NAME" >> $GITHUB_OUTPUT

        echo "Chart name: $NAME"
        echo "Chart version: $VERSION"

    - name: Read App Version
      id: app
      run: |
        APP_VERSION=$(tr -d '[:space:]' < VERSION)
        echo "appVersion=$APP_VERSION" >> $GITHUB_OUTPUT
        echo "App version: $APP_VERSION"
    
  docker:
    needs: environment
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
          ghcr.io/${{ github.repository }}:${{ needs.environment.outputs.appVersion }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
