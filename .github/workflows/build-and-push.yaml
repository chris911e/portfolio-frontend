name: Build And Push Image & Chart

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  environment:
    runs-on: ubuntu-latest
    outputs:
      chartVersion: ${{ steps.chart.outputs.chartVersion }}
      chartName: ${{ steps.chart.outputs.chartName }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Read Chart
      id: chart
      run: |
        VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
        NAME=$(grep '^name:' helm/Chart.yaml | awk '{print $2}')

        echo "chartVersion=$VERSION" >> $GITHUB_OUTPUT
        echo "chartName=$NAME" >> $GITHUB_OUTPUT

        echo "Chart name: $NAME"
        echo "Chart version: $VERSION"
    
  build-and-publish:
    needs: environment
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}

    - name: Set Docker image tag in Helm values.yaml
      run: |
        sed -i "s/^\s*tag: .*/  tag: $GITHUB_SHA/" helm/values.yaml
      
    - name: Package Helm Chart
      run: |
        helm package helm/
        mkdir -p helm-publish
        mv ${{ needs.environment.outputs.chartName }}-${{ needs.environment.outputs.chartVersion }}.tgz helm-publish/
    
    - name: Upload Helm Chart
      run: |
        helm push helm-publish/${{ needs.environment.outputs.chartName }}-${{ needs.environment.outputs.chartVersion }}.tgz oci://ghcr.io/${{ github.repository_owner }}

  trigger:
    needs: [build-and-publish, environment]
    runs-on: ubuntu-latest
    steps:
    - name: Trigger infra deployment
      env:
        TOKEN: ${{ secrets.INFRA_TOKEN }}
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: Bearer $TOKEN" \
          https://api.github.com/repos/${{ github.repository_owner }}/infra/dispatches \
          -d '{
            "event_type": "deploy",
            "deployment": {
              "sha": "${{ github.sha }}",
              "chartVersion": "${{ needs.environment.outputs.chartVersion }}",
              "chartName": "${{ needs.environment.outputs.chartName }}}"
            },
            "client_payload": {
              "actor": "${{ github.actor }}",
              "repository": "${{ github.repository }}",
              "repositryUrl": "${{ github.repositoryUrl }}",
              "triggeredBy": "${{ github.workflow }}"
            }
          }'
