name: Build And Push Image & Chart

on:
  pull_request:
  push:
    branches:
      - main

jobs:
    
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}

    - name: Set Docker image tag in Helm values.yaml
      run: |
        sed -i "s/^\s*tag: .*/  tag: $GITHUB_SHA/" helm/values.yaml
      
    - name: Package Helm Chart
      run: |
        helm package helm/
        mkdir -p helm-publish
        mv portfolio-frontend-chart-*.tgz helm-publish/
    
    - name: Upload Helm Chart
      run: |
        helm push helm-publish/portfolio-frontend-chart-*.tgz oci://ghcr.io/${{ github.repository_owner }}
