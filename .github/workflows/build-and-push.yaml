name: build-and-push.yaml

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  environment:
    runs-on: ubuntu-latest
    outputs:
      chartVersion: ${{ steps.chart.outputs.chartVersion }}
      chartName: ${{ steps.chart.outputs.chartName }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Read Chart
      id: chart
      run: |
        VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
        NAME=$(grep '^name:' helm/Chart.yaml | awk '{print $2}')

        echo "chartVersion=$VERSION" >> $GITHUB_OUTPUT
        echo "chartName=$NAME" >> $GITHUB_OUTPUT

        echo "Chart name: $NAME"
        echo "Chart version: $VERSION"
    
  docker:
    needs: environment
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  helm:
    needs: [docker, environment]
    runs-on: ubuntu-latest 
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Package Helm Chart
      run: |
        helm package helm/
        mkdir -p helm-publish
        mv ${{ needs.environment.outputs.chartName }}-${{ needs.environment.outputs.chartVersion }}.tgz helm-publish/
    
    - name: Upload Helm Chart
      if: github.event_name == 'push'
      run: |
        helm push helm-publish/${{ needs.environment.outputs.chartName }}-${{ needs.environment.outputs.chartVersion }}.tgz oci://ghcr.io/${{ github.repository_owner }}
